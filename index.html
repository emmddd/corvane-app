<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#C62D33">
  <meta name="color-scheme" content="only light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Corvane">
  <meta name="view-transition" content="same-origin">
  <title>Corvane</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar" id="topbar">
      <a class="brand" href="#/">
        <span class="logo" id="logo"></span>
        <span class="brand-name" id="brandName">Corvane</span>
        <span class="demo-chip" title="Prototype with sample data">Demo</span>
      </a>
      <div class="top-actions">
        <button class="icon-btn glass round" id="toggleHide" aria-label="Hide or show balances"></button>
        <a class="avatar" href="#/more" aria-label="Profile and settings">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="none" stroke="#fff" stroke-width="2"/><path d="M4.5 20.5c1.2-4 4-6 7.5-6s6.3 2 7.5 6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
        </a>
      </div>
    </header>
    <main id="view"></main>
    <nav class="tabbar glass" id="tabbar" aria-label="Main"></nav>
    <div class="toast glass" id="toast" role="status" aria-live="polite"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
