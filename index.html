<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#C62D33">
  <title>Corvane</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="#/">
        <span class="logo"><svg viewBox="0 0 24 24"><path d="M16.5 8.2A5.5 5.5 0 1 0 16.5 15.8" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/><circle cx="18.6" cy="9.9" r="1.3" fill="#fff"/><circle cx="18.6" cy="14.1" r="1.3" fill="#fff"/></svg></span>
        <span class="brand-name">Corvane</span>
      </a>
      <div class="top-actions">
        <button class="icon-btn" id="toggleHide" aria-label="Hide or show balances"></button>
        <a class="avatar" href="#/more" aria-label="Profile">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="none" stroke="#fff" stroke-width="2"/><path d="M4.5 20.5c1.2-4 4-6 7.5-6s6.3 2 7.5 6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
        </a>
      </div>
    </header>
    <main id="view"></main>
    <nav class="tabbar" id="tabbar"></nav>
    <div class="toast" id="toast" role="status"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
